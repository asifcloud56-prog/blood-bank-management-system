<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request History | BBMS</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="hospital" data-title="Request History">
<div id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
BBMS.init(async (user, el) => {
  const [req, his] = await Promise.all([BBMS.api('hospital', 'requests'), BBMS.api('hospital', 'history')]);
  el.innerHTML = `<div class="page-head"><div><h1>Request History</h1><p>Your blood requests and account activity</p></div></div>
    <div class="card"><h3>Blood requests</h3>${BBMS.table(['Lab', 'Blood', 'Units', 'Requested', 'Status', 'Processed'],
      req.data.map(r => [`<b>${BBMS.esc(r.lab_name)}</b><div class="small muted">${BBMS.esc(r.lab_phone)} · ${BBMS.esc(r.lab_city)}</div>`, BBMS.chip(r.blood_type), r.units, BBMS.fmtDateTime(r.created_at), BBMS.statusBadge(r.status), BBMS.fmtDate(r.processed_at)]), 'No requests yet')}</div>
    <div class="card mt" style="margin-top:1rem"><h3>Activity log</h3>${BBMS.historyList(his.history)}</div>`;
});
</script>
</body>
</html>
